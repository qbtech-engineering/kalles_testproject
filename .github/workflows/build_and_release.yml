name: Build and Release

on:
  workflow_dispatch:

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Gradle Version
        id: read
        uses: ./.github/actions/extract-version

      - run: echo "Project version is ${{ steps.read.outputs.version }}"

  release:
    runs-on: ubuntu-latest
    needs: extract-version
    steps:
      - run: echo "Releasing version ${{ needs.extract-version.outputs.version }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "HAL"
          git config --global url."https://${{ secrets.AUTOMATION_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Create release branch
        id: create_branch
        env:
          VERSION: ${{ needs.extract-version.outputs.version }}
        run: |
          BRANCH="release/v$VERSION"
          echo "Creating branch $BRANCH"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create tag
        id: create_tag
        env:
          VERSION: ${{ needs.extract-version.outputs.version }}
        run: |
          TAG="v$VERSION"
          echo "Creating tag $TAG"
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "✅ Created branch: ${{ steps.create_branch.outputs.branch }}"
          echo "✅ Created tag:    ${{ steps.create_tag.outputs.tag }}"