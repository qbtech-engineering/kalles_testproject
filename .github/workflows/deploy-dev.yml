name: Deploy to DEV

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Calculate Version with Git Hash
        id: full_version
        uses: ./.github/actions/extract-version
        with:
          is_beta: true

      - run: echo "Combined version is ${{ steps.full_version.outputs.version }}"

  deploy-dev:
    name: Deploy to ECS (dev)
    runs-on: ubuntu-latest
    needs: extract-version
    environment:
      name: dev

    steps:
      - name: Update ECS service (DEV)
        run: |
          echo "Deploying version ${{ needs.extract-version.outputs.version }} to production"
