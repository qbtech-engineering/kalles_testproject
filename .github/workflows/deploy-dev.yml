name: Deploy to Development Environment

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy-to-dev:
    uses: ./.github/workflows/reusable-workflow.yml
    secrets: inherit
    with:
      env: "dev"
      primary_region: eu-north-1
      secondary_regions: '["us-west-2"]'
      cluster_name: dev-qbneuron
      service_name: dev-qbneuron-nexus
      e2e_event_name: dev-qbneuron-tests
