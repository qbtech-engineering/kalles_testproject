name: Deploy to DEV

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Gradle Version
        id: read
        uses: ./.github/actions/extract-version
        with:
          is_beta: true

      - run: echo "Project version is ${{ steps.read.outputs.version }}"

  deploy-dev:
    name: Deploy to ECS (dev)
    runs-on: ubuntu-latest
    needs: extract-version
    environment:
      name: dev

    steps:
      - name: Update ECS service (DEV)
        run: |
          echo "Deploying version ${{ needs.extract-version.outputs.version }} to production"

  report-release-dev:
    name: Report Release on DEV
    runs-on: ubuntu-latest
    needs: [extract-version, deploy-dev]
    steps:
      - name: Report release
        shell: bash
        run: |
          curl -X POST https://httpbin.org/post -H "Content-Type: application/json" -d '{"version":"${{ needs.extract-version.outputs.version }}","application": "${{ github.repository }}","environment":"dev","deployed_by":"${{ github.actor }}"}'

